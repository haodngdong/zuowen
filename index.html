<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>作文模板复习</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1115;--card:#191d24;--card2:#21262f;--line:#2b313b;--tx:#e8ebf0;--tx2:#9aa4b2;--tx3:#6b7480;
--accent:#4f8cff;--good:#33c17a;--mid:#f0a93b;--bad:#f05f5f;--safe:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(80px + var(--safe));min-height:100%}
.hdr{padding:20px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hdr h1{font-size:21px;margin:0;font-weight:700}
.hdr .sub{color:var(--tx3);font-size:13px;flex:0 0 auto}
.view{display:none}.view.on{display:block}
.todayCard{background:linear-gradient(160deg,#1e2635,#171b22);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:6px}
.bigNum{font-size:50px;font-weight:800;line-height:1;letter-spacing:-1px}
.bigNum small{font-size:15px;font-weight:600;color:var(--tx2);margin-left:6px}
.todayCard p{color:var(--tx2);margin:10px 0 0;font-size:14px}
.bar{height:7px;background:#2a3038;border-radius:99px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#7a5cff);border-radius:99px;transition:width .4s}
.meta{display:flex;gap:16px;color:var(--tx3);font-size:13px;margin-top:12px;flex-wrap:wrap}
.meta b{color:var(--tx);font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:15px;padding:16px;font-size:16.5px;font-weight:700;color:#fff;background:var(--accent);margin-top:16px;font-family:inherit}
.btn:active{transform:scale(.985);opacity:.92}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line);margin-top:10px}
.btn:disabled{opacity:.4}
/* 单元 */
.unit{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:10px;display:flex;gap:13px;align-items:center}
.unit:active{background:var(--card2)}
.unit .no{width:34px;height:34px;border-radius:10px;background:#242b36;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--tx2);flex:0 0 auto}
.unit.rec .no{background:var(--accent);color:#fff}
.unit .body{flex:1;min-width:0}
.unit .nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:7px}
.unit .ds{color:var(--tx3);font-size:12.5px;margin-top:3px}
.unit .pb{height:4px;background:#2a3038;border-radius:99px;margin-top:8px;overflow:hidden}
.unit .pb i{display:block;height:100%;background:var(--good);border-radius:99px}
.unit .pct{font-size:12px;color:var(--tx3);flex:0 0 auto}
.mini{border:1px solid var(--line);background:transparent;color:var(--tx2);border-radius:9px;
  padding:7px 16px;font-size:13px;font-family:inherit;font-weight:600}
.mini:active{background:var(--card2)}
.mini[data-sp]{color:#8fb4ff;border-color:#2f3f5e}
.tagx{font-size:10px;padding:1px 6px;border-radius:99px;background:#3a2a1c;color:#f0b96b;font-weight:600}
/* 学习 */
#study{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(20px + var(--safe))}
#study.on{display:block}
.sbar{display:flex;align-items:center;justify-content:space-between;padding:13px 0 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.sbar .x{font-size:25px;color:var(--tx2);padding:0 6px;line-height:1}
.sbar .cnt{font-size:13px;color:var(--tx3);font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 19px;margin-top:4px}
.tag{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:99px;background:#243044;color:#8fb4ff;font-weight:600;margin-bottom:12px}
.tag.c2{background:#2b2440;color:#b39dff}.tag.c3{background:#16342a;color:#5fd39a}.tag.c4{background:#3a2a1c;color:#f0b96b}
.qname{font-size:21px;font-weight:700;margin:0 0 8px;line-height:1.35}
.qzh{color:var(--tx2);font-size:16px;margin:0}
.label{font-size:11.5px;color:var(--tx3);font-weight:700;letter-spacing:1px;margin:16px 0 5px;text-transform:uppercase}
.en{font-size:16.5px;line-height:1.75;color:#fff;font-weight:500}
.en em{background:#2f3a4d;font-style:normal;border-radius:4px;padding:1px 3px}
.exbox{background:var(--card2);border-left:3px solid var(--accent);border-radius:10px;padding:13px 15px;margin-top:5px}
.exbox .en{font-size:15px;font-weight:400}
.exzh{color:var(--tx2);font-size:13px;margin-top:9px}
.tip{color:var(--tx3);font-size:12.5px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.btns{position:sticky;bottom:0;background:var(--bg);padding:14px 0 4px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.btns button{border:0;border-radius:14px;padding:15px 6px;font-size:14.5px;font-weight:700;color:#fff;font-family:inherit}
.btns .b1{background:#3a2229;color:#ff8b8b}.btns .b2{background:#3a3122;color:#ffc86b}.btns .b3{background:#1e3a2c;color:#63d999}
.btns button:active{opacity:.85;transform:scale(.97)}
.reveal{width:100%;border:1px dashed var(--line);background:transparent;color:var(--tx2);border-radius:14px;padding:17px;font-size:15px;font-family:inherit;margin-top:20px}
.done{text-align:center;padding:56px 20px}
.done .em{font-size:54px}
.done h2{font-size:21px;margin:14px 0 8px}
.done p{color:var(--tx2);font-size:14px;margin:0 0 24px}
/* 拼写 */
.spellbox{margin-top:18px}
.spellbox input{width:100%;background:#0c0e12;border:1.5px solid var(--line);border-radius:13px;color:#fff;
  font-size:19px;padding:15px 16px;font-family:ui-monospace,Menlo,monospace;outline:none;letter-spacing:.5px}
.spellbox input:focus{border-color:var(--accent)}
.spellbox input.ok{border-color:var(--good)}.spellbox input.no{border-color:var(--bad)}
.fb{margin-top:12px;font-size:14.5px;padding:13px 15px;border-radius:11px;line-height:1.6}
.fb.ok{background:#16342a;color:#7ee0ac}.fb.no{background:#3a2229;color:#ffb3b3}
.fb .cor{font-family:ui-monospace,Menlo,monospace;font-size:16px;color:#fff;display:block;margin-top:6px}
/* 真题 */
.exam{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:10px}
.exam:active{background:var(--card2)}
.exam .t{font-weight:700;font-size:15px}
.exam .s{color:var(--tx3);font-size:12.5px;margin-top:4px}
.exhdr{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:2;display:flex;justify-content:space-between;align-items:center}
.exhdr .x{font-size:25px;color:var(--tx2);padding:0 6px}
.exhdr .t{font-weight:700;font-size:15px;text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eximg{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;margin-top:10px;background:#fff;display:block}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:11px;font-size:13px;color:var(--tx2);line-height:1.6}
.cn{background:#1b2027;border-radius:12px;padding:13px 15px;margin-top:10px;font-size:13.5px;color:#c8d0dc;line-height:1.65}
textarea{width:100%;min-height:170px;background:#0c0e12;border:1.5px solid var(--line);border-radius:13px;color:#e8ebf0;
  font-size:15px;line-height:1.7;padding:14px;font-family:inherit;outline:none;margin-top:12px;resize:vertical}
textarea:focus{border-color:var(--accent)}
.wcount{font-size:12px;color:var(--tx3);text-align:right;margin-top:6px}
.ref{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;font-size:15px;line-height:1.8}
.ref .p{margin:0 0 12px}
.ref .p:last-child{margin:0}
.ref b{color:#ffd479;font-weight:600;font-size:12px;display:block;margin-bottom:3px}
/* 计划 */
.plan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:11px}
.plan h3{margin:0 0 5px;font-size:15.5px}
.plan .p{color:var(--tx2);font-size:13.5px;margin:0;line-height:1.65}
.plan.now{border-color:var(--accent);background:linear-gradient(160deg,#1b2740,#171b22)}
.plan .badge{float:right;font-size:11px;background:var(--accent);color:#fff;padding:2px 9px;border-radius:99px}
.days{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:13px}
.days div{aspect-ratio:1;border-radius:7px;background:#232933;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--tx3)}
.days div.done{background:#1e3a2c;color:#63d999;font-weight:700}
.days div.today{background:var(--accent);color:#fff;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe);z-index:60}
nav button{flex:1;border:0;background:none;color:var(--tx3);padding:10px 0 8px;font-size:10.5px;font-family:inherit}
nav button .ic{display:block;font-size:19px;line-height:1.3}
nav button.on{color:var(--accent)}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe));transform:translate(-50%,12px);
  background:#2b3341;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.mark{font-size:11px;color:#f0b96b;margin-left:6px;font-weight:700}
.again{display:inline-block;font-size:11px;margin-left:7px;padding:1px 8px;border-radius:99px;
  background:#3a2a1c;color:#f0b96b;font-weight:700;vertical-align:middle}
</style>
</head>
<body>
<div id="app">
  <div class="view on" id="v-today">
    <div class="hdr"><h1>今日复习</h1><span class="sub" id="dayLabel"></span></div>
    <div class="todayCard">
      <div class="bigNum" id="dueNum">0<small>张待学</small></div>
      <div class="bar"><i id="progBar" style="width:0%"></i></div>
      <p id="hintTxt">读取中…</p>
      <div class="meta"><span>已掌握 <b id="mMastered">0</b></span><span>学习中 <b id="mLearn">0</b></span><span>卡片 <b id="mTotal">0</b></span><span>真题 <b id="mExam">0</b></span></div>
      <button class="btn" id="startBtn">开始今天的学习</button>
    </div>
    <div class="todayCard" style="margin-top:12px">
      <div style="font-size:14.5px;font-weight:700;margin-bottom:8px">📌 今天重点</div>
      <p style="color:var(--tx2);font-size:13.5px;margin:0" id="focusTxt"></p>
    </div>
  </div>

  <div class="view" id="v-units">
    <div class="hdr"><h1>按段落学</h1><span class="sub" id="unitSub"></span></div>
    <div id="unitList"></div>
  </div>

  <div class="view" id="v-spell">
    <div class="hdr"><h1>拼写检测</h1><span class="sub" id="spSub"></span></div>
    <div class="todayCard">
      <div class="bigNum" id="spDue">0<small>个待拼</small></div>
      <p id="spHint">看中文写英文，写完自动判对错。写不出可以点「提示」。</p>
      <div class="meta"><span>今天已拼 <b id="spDone">0</b></span><span>正确率 <b id="spRate">—</b></span></div>
      <button class="btn" id="spStart">开始拼写</button>
      <button class="btn sec" id="spAll">全部过一遍（163 个）</button>
    </div>
    <div class="todayCard" style="margin-top:12px">
      <div style="font-size:14.5px;font-weight:700;margin-bottom:8px">⌨ 拼写范围</div>
      <p style="color:var(--tx2);font-size:13.5px;margin:0" id="spScope"></p>
    </div>
  </div>

  <div class="view" id="v-exams">
    <div class="hdr"><h1>真题套写</h1><span class="sub">20 套</span></div>
    <div style="color:var(--tx3);font-size:13px;margin:-4px 2px 12px;line-height:1.6">先自己写，写完点「看参考全文」对照。写的内容会存着。</div>
    <div id="examList"></div>
  </div>

  <div class="view" id="v-plan">
    <div class="hdr"><h1>32 天计划</h1><span class="sub">距考试 <b id="dLeft">32</b> 天</span></div>
    <div id="plans"></div>
  </div>
</div>

<div id="study"><div class="sbar"><span class="x" id="sClose">✕</span><span class="cnt" id="sCnt"></span><span style="width:28px"></span></div><div id="host"></div></div>

<nav>
  <button class="on" data-v="today"><span class="ic">◎</span>今日</button>
  <button data-v="units"><span class="ic">▤</span>单元</button>
  <button data-v="spell"><span class="ic">⌨</span>拼写</button>
  <button data-v="exams"><span class="ic">✎</span>套写</button>
  <button data-v="plan"><span class="ic">▦</span>计划</button>
</nav>

<script>
const UNITS = [["u1","第一段","三句话：待选 1/3 + 公式 1/2/3 + 方案 4/1","tpl",[{"id":"p1-1","zh":"图表展示了 X 从 Y1 到 Y2 的变化，期间稳步上升。","en":"The chart above illustrates the changes in X from Y1 to Y2, during which it rose steadily.","ex":"The line chart above illustrates the changes in Chinese residents' health literacy level from 2012 to 2021, during which it rose steadily.","exzh":"折线图展示了 2012 至 2021 年中国居民健康素养水平的变化，其间稳步上升。（2023 英二）","tip":"line/bar chart 按图换；steadily 可换 sharply/significantly"},{"id":"p1-2","zh":"柱状图呈现了 X 的分布，其中 A 占比最高。","en":"The bar chart above presents the distribution of X, with A accounting for the largest share.","ex":"The pie chart above presents the distribution of consumers' priorities when choosing a restaurant, with distinctive features accounting for the largest share.","exzh":"饼图呈现了消费者选择餐厅时关注因素的分布，其中“特色”占比最高。（2018 英二）","tip":"分布用 distribution；最大项用 accounting for the largest share"},{"id":"p1-3","zh":"左图展示了 X，右图呈现了 Y。","en":"The chart on the left illustrates X, while the chart on the right presents Y.","ex":"The chart on the left illustrates consumers' attitudes towards elderly-care robots, while the chart on the right presents their major concerns about such robots.","exzh":"左图展示了消费者对养老机器人的态度，右图呈现了他们对这类机器人的主要担忧。（2026 英一）","tip":"左右各一句，用 while 并列"},{"id":"p1-4","zh":"图表反映出 X 在某期间朝相反方向变化，A 上升而 B 下降。","en":"As reflected in the chart, X moved in opposite directions from Y1 to Y2, A rising while B falling.","ex":"As reflected in the chart, China's urban and rural population moved in opposite directions from 1990 to 2010, the urban population rising while the rural population falling.","exzh":"图表反映出 1990 至 2010 年中国城乡人口朝相反方向变化，城镇人口上升而乡村人口下降。（2014 英二）","tip":"只有一升一降才能用！同向上升用待选 1"},{"id":"p1-5","zh":"具体而言，Sth1 从 A 升/降到 B；然而 Sth2 从 C 到 D。","en":"To be specific, Sth1 increased dramatically from A to B. However, Sth2 climbed modestly from C to D.","ex":"To be specific, the number of subscriptions in developing countries soared from about 0.2 billion to 4 billion. However, the figure for developed countries climbed modestly, from about 0.5 billion to 1 billion.","exzh":"具体而言，发展中国家用户数从约 2 亿猛增至 40 亿；而发达国家的数字从约 5 亿小幅增至 10 亿。（2010 英二）","tip":"最多两个变量；动词+副词要换着用"},{"id":"p1-6","zh":"某年 Sth 为 X，而另一年为 Y，增长了 Z。","en":"The proportion of Sth was X in Y2, compared with Y in Y1, showing an increase of Z percentage points.","ex":"The proportion of graduates pursuing further study was 34.0% in 2018, compared with 26.3% in 2013, showing an increase of 7.7 percentage points.","exzh":"2018 年选择深造的毕业生比例为 34.0%，2013 年为 26.3%，增长了 7.7 个百分点。（2019 英二）","tip":"必须图上有具体数值；增量记得带单位"},{"id":"p1-7","zh":"某年 Sth 是另一年的 X 倍。","en":"The number of Sth in Y2 was X times that in Y1.","ex":"Meanwhile, the 2018 figure for those starting a business was twice that in 2013.","exzh":"与此同时，2018 年创业人数是 2013 年的两倍。（2019 英二）","tip":"2 倍 twice，3 倍 triple，以上用数字 + times"},{"id":"p1-8","zh":"从统计可以明显看出，X 日益受到公众关注。","en":"It is apparent from the statistics that X has drawn growing attention from the public.","ex":"It is apparent from the statistics that elderly-care robots have drawn growing attention from the public.","exzh":"从统计可以明显看出，养老机器人日益受到公众关注。（2026 英一）","tip":"抽象/技术/新生事物用它；观念类改 People attach growing importance to X"},{"id":"p1-9","zh":"从统计可以明显看出，X 近年来发展迅速。","en":"It is apparent from the statistics that X has been developing rapidly in recent years.","ex":"It is apparent from the statistics that the health literacy level has been improving rapidly in recent years.","exzh":"从统计可以明显看出，健康素养水平近年来迅速提升。（2023 英二）","tip":"实体/行业用 developing，水平/率/数量用 improving"}]],["u2","第二段","过渡句 + 方案一/二/三/五/七 + 七个举例短语","tpl",[{"id":"p2-0","zh":"这一现象有诸多原因可以解释。","en":"A variety of reasons can be cited to account for this phenomenon.","ex":"A variety of reasons can be cited to account for this phenomenon. To begin with, my roommate Kevin is passionate about using mobile apps to keep in touch with friends.","exzh":"这一现象有诸多原因可以解释。首先，我的室友凯文热衷于用手机应用与朋友保持联系。（2010 英二）","tip":"也可用 Three key reasons, from my perspective, account for this phenomenon."},{"id":"p2-1","zh":"首先，某人热衷于做某事，这给他带来……结果……","en":"To begin with, sb is passionate about doing sth, which helps him do sth. Consequently, he has become ...","ex":"To begin with, my roommate Kevin is passionate about using mobile apps to keep in touch with friends, which helps him stay connected with people far away. Consequently, he has become the most sociable person in our class.","exzh":"首先，我的室友凯文热衷于用手机应用与朋友保持联系，这帮助他与远方的人保持联络。结果，他成了班上最善于交际的人。（2010 英二）","tip":"四步：引出例子 → 短语写现状 → which 结果 → 另起一句说成效"},{"id":"p2-2","zh":"首先，大多数人认为 X 会为他们提供更广阔的发展平台，这或许让他们在未来处于有利地位。","en":"To begin with, the majority of people believe that X will provide them with a broader platform to develop themselves, which may put them in a beneficial position in the future.","ex":"To begin with, the majority of people believe that pursuing a higher degree will provide them with a broader platform to develop themselves, which may put them in a beneficial position in the future.","exzh":"首先，大多数人认为攻读更高学位会为他们提供更广阔的发展平台，这或许会让他们在未来处于有利地位。（2019 英二）","tip":"适合「选择/趋势」类主题"},{"id":"p2-3","zh":"更重要的是，我们面临着不可否认的事实：X 在某方面起着关键作用。","en":"What is more, we are faced with the undeniable fact that X plays a crucial role in 某方面.","ex":"What is more, we are faced with the undeniable fact that acquiring relevant knowledge plays a crucial role in personal growth.","exzh":"更重要的是，我们面临着不可否认的事实：学到相关知识在个人成长中起着关键作用。（2024 英二）","tip":"某方面从六大方面里挑，只用 ★/✓ 的词"},{"id":"p2-4","zh":"最重要的是，如果我们忽视 X 的重要性，我们将永远无法成为更好的自己。","en":"Most importantly, if we ignored the importance of X, we would never become a better version of ourselves.","ex":"Most importantly, if we ignored the importance of physical exercise, we would never become a better version of ourselves.","exzh":"最重要的是，如果我们忽视体育锻炼的重要性，我们将永远无法成为更好的自己。（2021 英二）","tip":"只写个人层面即可，不必再加社会层面"},{"id":"p2-5","zh":"更重要的是，X 是连接 A 与 B 的桥梁。","en":"What is more, X is the bridge between A and B.","ex":"What is more, parks and public spaces are the bridge between urban residents and a healthy lifestyle.","exzh":"更重要的是，公园和公共空间是连接城市居民与健康生活的桥梁。（2024 英一）","tip":"桥梁用于「连接两类事物」；引擎用于「推动成长」，指南针用于「指引方向」"},{"id":"p2x-1","zh":"对……有激情/热衷于（举例短语）","en":"be passionate about","ex":"To begin with, my roommate Kevin is passionate about using mobile apps to keep in touch with friends.","exzh":"首先，我的室友凯文热衷于用手机应用与朋友保持联系。（2010 英二）","tip":"方案一四步里的第二步，用来写「现状」"},{"id":"p2x-2","zh":"沉迷于（贬义）（举例短语）","en":"be addicted to","ex":"To begin with, my classmate Lily is addicted to reading fragmented articles on her phone all day.","exzh":"首先，我的同学莉莉沉迷于整天在手机上读碎片化文章。（2020 英二）","tip":"方案一四步里的第二步，用来写「现状」"},{"id":"p2x-3","zh":"致力于（举例短语）","en":"be committed to","ex":"To begin with, my uncle is committed to working on new energy vehicle technology.","exzh":"首先，我叔叔致力于研究新能源汽车技术。（2011 英二）","tip":"方案一四步里的第二步，用来写「现状」"},{"id":"p2x-4","zh":"从事（举例短语）","en":"be engaged in","ex":"To begin with, my cousin is engaged in selling local fruit online.","exzh":"首先，我表姐从事网上销售本地水果的工作。（2022 英二）","tip":"方案一四步里的第二步，用来写「现状」"},{"id":"p2x-5","zh":"高度重视（前两个之一）（举例短语）","en":"place a high priority on","ex":"To begin with, my grandfather places a high priority on preparing gifts for every family member.","exzh":"首先，我爷爷非常重视为每位家人准备礼物。（2015 英二）","tip":"方案一四步里的第二步，用来写「现状」"},{"id":"p2x-6","zh":"厌烦（举例短语）","en":"be tired of","ex":"To begin with, many young people are tired of working overtime without any rest.","exzh":"首先，很多年轻人厌倦了无休止的加班。（2012 英二）","tip":"方案一四步里的第二步，用来写「现状」"},{"id":"p2x-7","zh":"漠不关心（举例短语）","en":"be indifferent to","ex":"To begin with, some residents are indifferent to waste classification.","exzh":"首先，一些居民对垃圾分类漠不关心。","tip":"方案一四步里的第二步，用来写「现状」"}]],["u3","第三段","总结（方案一/二）+ 措施（政府/个人/媒体）+ 畅想（待选 2/4）","tpl",[{"id":"p3-1","zh":"不难得出结论：我们自身和社会都必须对 X 给予足够重视。","en":"It is not difficult to draw the conclusion that enough attention must be paid to X by ourselves and our community.","ex":"It is not difficult to draw the conclusion that enough attention must be paid to physical exercise by ourselves and our community.","exzh":"不难得出结论：我们自身和社会都必须对体育锻炼给予足够重视。（2021 英二）","tip":"稍长（约 21 词）；想短就用方案二倒装"},{"id":"p3-2","zh":"我们绝不能低估 X 的深远影响。","en":"By no means should we underestimate the profound impact of X.","ex":"By no means should we underestimate the profound impact of mobile-phone subscriptions.","exzh":"我们绝不能低估手机普及的深远影响。（2010 英二）","tip":"比方案一短 10 词；倒装别写错语序"},{"id":"p3-3","zh":"一方面，当局必须……","en":"For one thing, it is imperative for the authorities to make strict laws / formulate policies / allocate more funds.","ex":"For one thing, it is imperative for the authorities to build more public sports facilities.","exzh":"一方面，当局必须建设更多公共体育设施。（2021 英二）","tip":"三个动作按主题挑：立法、制定政策、拨款"},{"id":"p3-4","zh":"另一方面，我们应该……","en":"For another, we should take concrete steps to do sth.","ex":"For another, we should take concrete steps to exercise regularly.","exzh":"另一方面，我们应当拿出实际行动，坚持规律锻炼。（2021 英二）","tip":"we should 可换 It is our duty to / We are obliged to"},{"id":"p3-5","zh":"新媒体平台，从短视频到社交媒体，应当呼吁公众……","en":"New media platforms, ranging from short video apps to social media, should appeal to the public to do sth.","ex":"New media platforms, ranging from short video apps to social media, should appeal to the public to live a healthy life.","exzh":"新媒体平台，从短视频应用到社交媒体，应当呼吁公众过健康的生活。（2023 英二）","tip":"ranging from A to B 是加分结构"},{"id":"p3-6","zh":"只有通过所有人的共同努力，我们才能有效地……","en":"Only through the joint efforts of all people can we effectively promote sth.","ex":"Only through the joint efforts of all people can we effectively promote the healthy development of the telecommunications industry.","exzh":"只有通过所有人的共同努力，我们才能有效促进电信业的健康发展。（2010 英二）","tip":"Only 开头必须部分倒装：can we"},{"id":"p3-7","zh":"现在正是我们采取集体果断行动的时候了。","en":"There is no better time than now for us to take collective and decisive action to address this pressing issue.","ex":"There is no better time than now for us to take collective and decisive action to address this pressing issue.","exzh":"现在正是我们采取集体果断行动解决这一紧迫问题的时候了。","tip":"万能句，无需改任何内容"}]],["u4","比喻句","方案七的六个喻体，挑三个背死","tpl",[{"id":"m1","zh":"如同灯塔一样重要，在困难时为我们指引方向。","en":"X is as important as a lighthouse, providing guidance in difficult times.","ex":"Confidence is as important as a lighthouse, providing guidance in difficult times.","exzh":"自信如同灯塔一样重要，在困难时为我们指引方向。","tip":"适配：自信、乐观、积极心态、好奇心"},{"id":"m2","zh":"像指南针一样不可或缺，帮我们应对人生挑战。","en":"X is as essential as a compass, helping us navigate through life's challenges.","ex":"Critical thinking is as essential as a compass, helping us navigate through life's challenges.","exzh":"批判性思维像指南针一样不可或缺，帮我们应对人生挑战。","tip":"适配：知识、学习、教育、批判性思维"},{"id":"m3","zh":"是开启成功之门的钥匙。","en":"X is the key that unlocks the door to success.","ex":"Elderly-care robots are the key to unlocking high-quality and efficient elderly care.","exzh":"养老机器人是开启高质量高效养老的钥匙。（2026 英一）","tip":"适配：技术、创新、方法类"},{"id":"m4","zh":"是推动个人成长与社会进步的引擎。","en":"X is the engine that propels personal growth and social progress.","ex":"Labor practice is the engine that propels students' personal growth and all-round development.","exzh":"劳动实践是推动学生个人成长和全面发展的引擎。（2024 英二）","tip":"适配：坚持、自律、行动、实践"},{"id":"m5","zh":"是连接目标与成就的桥梁。","en":"X is the bridge between goals and accomplishments.","ex":"Leisure activities are the bridge between the elderly and an active, socially connected later life.","exzh":"休闲活动是连接老年人与积极、有社交的晚年生活的桥梁。（2025 英二）","tip":"适配：合作、沟通、指导、创新"},{"id":"m6","zh":"是我们构建可持续未来的基石。","en":"X is the foundation upon which we build a sustainable future.","ex":"Household appliances are the foundation of a convenient and comfortable modern life.","exzh":"家用电器是便利舒适现代生活的基石。（2025 英一）","tip":"适配：诚信、道德、信任"}]],["u5","六大方面·社会方面","26 条短语（★/✓ 是重点）","phrase",[{"id":"u5-1","en":"social progress / development / stability","zh":"社会进步/发展/稳定","mark":"★★","yj":"","spell":true,"hint":"2 词：s p　或　1 词：d　或　1 词：s","use":"What is more, we are faced with the undeniable fact that X plays a crucial role in social progress.","usezh":"更重要的是，我们面临着不可否认的事实：X 在「社会进步/发展/稳定」中起着关键作用。"},{"id":"u5-2","e triking. To be specific, the number of subscriptions in developing countries soared from about 0.2 billion to 4 billion. However, the figure for developed countries climbed modestly, from about 0.5 billion to 1 billion. It is apparent from the statistics that mobile phones have drawn growing attention from the public.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my roommate Kevin is passionate about using mobile apps to keep in touch with friends, which helps him stay connected with people far away. Consequently, he has become the most sociable person in our class. What is more, we are faced with the undeniable fact that the popularization of mobile phones plays a crucial role in effective communication. Most importantly, if we ignored the importance of the popularization of mobile phones, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to the popularization of mobile phones by ourselves and our community. For one thing, it is imperative for the authorities to improve network coverage in rural areas. For another, we should use mobile phones in a sensible way, and new media platforms should appeal to the public to spread the idea of a healthy digital life. Only through the joint efforts of all people can we effectively promote the healthy development of the telecommunications industry.","words":258},{"id":"ex-二2011","label":"2011 英二","title":"轿车市场品牌份额（柱状图，2008—2009，国产升、日系降）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"柱状图：2008、2009 年国内轿车市场部分品牌市场份额示意图，纵轴 0%—40%，含国产品牌、日系、美系、德系、韩系、法系等，其中国产品牌份额上升、日系下降。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7  never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to technological innovation of domestic car brands by ourselves and our community. For one thing, it is imperative for the authorities to formulate industry-friendly policies for domestic brands. For another, we should support domestic brands in daily choices, and new media platforms should appeal to the public to introduce the progress of domestic brands to the public. Only through the joint efforts of all people can we effectively promote the rise of domestic car brands.","words":256},{"id":"ex-二2012","label":"2012 英二","title":"员工工作满意度（交叉表，例外）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"表：某公司员工工作满意度调查——≤40 岁：满意 16.7%、不清楚 50.0%、不满意 33.3%；41—50 岁：0.0%、36.0%、64.0%；>50 岁：40.0%、50.0%、10.0%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAIWAtADASIAAhEBAxEB/8QAGwABAQACAwEAAAAAAAAAAAAAAAYEBQECAwf/xABVEAABAwMBBAQGDQkHAwMEAgMBAAIDBAURBhITITEWQVHTFCJWYZGVBxUXMlNUVXFzgZOU0iM0NTZCUnSxsjNicnWhs8EkQ4IlkrQ3RGODReGi0fD/xAAUAQEAAAAAAAAAAAAAAAAAAAAA/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8A+zLRVWsrPR3l1nmkn8PawybhlO9zizGdoYByMBb1fLLm+pZ7PlMaOKOWb2sOy2R5Y33ruZAP8kH0W0Xq236iFZa6yOqgyWlzDyPYQeIPmKzl84otOXjQGj7pV0dZRS3KrqBPPJK7dwQtzx2S7sBPP0cOPppzVdxuGo9R2rwyWakpaVtRRzTRBsrctB7BkccjI5IPoa6Mljkc9rHtc6M7LwDktOM4P1EL55oS46v1XZ6C8VF7gipxJMyeJtK3blA4NOeQIPVjq6+Sew66tq7Rca6quM9Q6S4Sh7HhpDnYb4+cZz1YzjzIK296qtOnpqeK5zSQuqnbEJETnCR3YMDnxC727U9oudymttPVEV0AzJTSxujkaO3DgMjj1KG9mXaFTpbYALvbHgHHAzlvNeVPIKf2b2y6ibuK+en2Le2lO1C5uCPGccOzwd1Yz9SD6oiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgI P//Z","p1":"The table above presents the distribution of employees' job satisfaction in a company, with the middle-aged group accounting for the largest share of dissatisfaction. To be specific, half of the employees under 40 and half of those over 50 were uncertain about their satisfaction, while 64% of those aged 41–50 were dissatisfied. It is apparent from the statistics that job satisfaction has drawn growing attention from the public.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my cousin is addicted to working overtime without any rest, which leaves him exhausted and unmotivated. Consequently, he finally chose to change to a more balanced job. What is more, we are faced with the undeniable fact that job satisfaction plays a crucial role in personal growth. Most importantly, if we ignored the importance of job satisfaction, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to job satisfaction by ourselves and our community. For one thing, it is imperative for the authorities to improve the labor protection system. For another, we should value our own physical and mental health, and new media platforms should appeal to the public to call on companies to care about employees' well-being. Only through the joint efforts of all people can we effectively promote a healthier workplace.","words":230},{"id":"ex-二2013","label":"2013 英二","title":"大学生兼职（柱状图，大一 → 大四，67.77% → 88.24%）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"柱状图：某高校学生兼职情况——大一 67.77%、大二 71.13%、大三 71.93%、大四 88.24%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Oz IiAiIgIiICIiAiIgIiICIiAiIg/9k=","p1":"The bar chart above illustrates the changes in students' part-time jobs from the freshman year to the senior year, during which it rose steadily. To be specific, the proportion of students taking part-time jobs increased gradually from 67.77% to 88.24%. It is apparent from the statistics that people attach growing importance to part-time employment.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my roommate Kevin is passionate about taking part-time jobs on campus, which helps him gain practical experience. Consequently, he has become the most capable one in our class. What is more, we are faced with the undeniable fact that part-time jobs plays a crucial role in personal growth. Most importantly, if we ignored the importance of part-time jobs, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to part-time jobs by ourselves and our community. For one thing, it is imperative for the authorities to regulate the part-time job market. For another, we should take concrete steps to balance study and work, and new media platforms should appeal to the public to call on students to choose part-time jobs wisely. Only through the joint efforts of all people can we effectively promote the healthy growth of college students.","words":221},{"id":"ex-二2014","label":"2014 英二","title":"城镇与乡村人口（柱状图，1990—2010，城镇 3→6.66 亿，乡村 8.34→6.74 亿）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"柱状图：20 年间中国城镇人口与乡村人口变化（单位：百万）——城镇 1990 年 300、2000 年 458、2010 年 666；乡村 834、807、674。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7O 6781ckRAREQEREBERAREQEREBERAREQEREBERB/9k=","p1":"The pie chart above presents the distribution of college students' purposes for travelling, with enjoying the scenery accounting for the largest share. To be specific, the proportions of students who travel to appreciate scenery, relieve stress, make friends and develop independence account for 37%, 33%, 9% and 6% respectively. It is apparent from the statistics that travelling has drawn growing attention from college students.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my classmate, Lucy is passionate about travelling to different cities during holidays, which helps her broaden her horizons. Consequently, she has become more independent than before. What is more, we are faced with the undeniable fact that travelling plays a crucial role in personal growth. Most importantly, if we ignored the importance of travelling, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to travelling by ourselves and our community. For one thing, it is imperative for the authorities to improve tourism services. For another, we should plan our trips in a reasonable way, and new media platforms should appeal to the public to introduce meaningful travel routes to young people. Only through the joint efforts of all people can we effectively promote the healthy growth of college students.","words":222},{"id":"ex-二2017","label":"二2017","title":"","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"","img":"","p1":"The bar chart above illustrates the changes in the number of museums and visitors in China from 2013 to 2015, during which both rose steadily. To be specific, the number of museums increased gradually from 4,165 to 4,692, while the number of visitors climbed significantly from 637.8 million to 781.1 million. It is apparent from the statistics that visiting museums is becoming increasingly popular.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my cousin is passionate about visiting museums at weekends, which helps him learn history in a vivid way. Consequently, he has become the most knowledgeable one among us. What is more, we are faced with the undeniable fact that visiting museums plays a crucial role in personal growth. Most importantly, if we ignored the importance of visiting museums, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to visiting museums by ourselves and our community. For one thing, it is imperative for the authorities to allocate more funds to public museums. For another, we should spend our free time in museums and galleries, and new media platforms should appeal to the public to call on young people to visit museums. Only through the joint efforts of all people can we effectively promote cultural prosperity.","words":227},{"id":"ex-二2018","label":"2018 英二","title":"选择餐厅的关注因素（饼图：特色 36.3%、服务 26.8%、环境 23.8%、价格 8.4%、其他 4.7%）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"饼图：2017 年某市消费者选择餐厅时的关注因素——特色 36.3%、服务 26.8%、环境 23.8%、价格 8.4%、其他 4.7%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCALXAtADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAgMEBwEI/8QAVBAAAQQCAAQCBQYHDAcHBAMBAQACAwQFEQYSITETQRQiUWFxBxUygZHRI1JUc5OhsRYzNDU2QlNydJSywWKCkrPC0uEXJENVg6LwJTdE8QhjdUX/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/xAAVEQEBAAAAAAAAAAAAAAAAAAAAAf/aAAwDAQA  consumers who value features, service, environment and price account for 36.3%, 26.8%, 23.8% and 8.4% respectively. It is apparent from the statistics that consumers attach growing importance to dining experience.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my friend, Tom places a high priority on choosing restaurants with a pleasant environment, which makes his meals more enjoyable. Consequently, he has become a real expert on local restaurants. What is more, we are faced with the undeniable fact that dining experience plays a crucial role in quality of life. Most importantly, if we ignored the importance of dining experience, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to dining experience by ourselves and our community. For one thing, it is imperative for the authorities to strengthen food safety supervision. For another, we should choose restaurants with distinctive features, and new media platforms should appeal to the public to introduce high-quality restaurants to the public. Only through the joint efforts of all people can we effectively promote the healthy development of the catering industry.","words":227},{"id":"ex-二2019","label":"2019 英二","title":"本科毕业生去向（柱状图，2013 vs 2018，就业 68.1→60.7，升学 26.3→34.0，创业 1.3→2.6）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"柱状图：某高校 2013 和 2018 年本科毕业生去向——就业 68.1%→60.7%、升学 26.3%→34.0%、创业 1.3%→2.6%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAKGAtADASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAMGAgQFBwH/xABPEAABAwMCAwQFCAgDBQcEAwEBAAIDBAUREiEGE e postgraduate entrance examination, which helps him build a solid academic foundation. Consequently, he has been admitted to his ideal university. What is more, we are faced with the undeniable fact that pursuing further study plays a crucial role in personal growth. Most importantly, if we ignored the importance of pursuing further study, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to pursuing further study by ourselves and our community. For one thing, it is imperative for the authorities to expand graduate enrolment reasonably. For another, we should make a plan that suits our own situation, and new media platforms should appeal to the public to introduce different choices after graduation to students. Only through the joint efforts of all people can we effectively promote the all-round development of young people.","words":258},{"id":"ex-二2020","label":"2020 英二","title":"手机阅读目的（饼图：学知识 59.5%、消遣 21.3%、获取信息 17%、其他 2.2%）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"饼图：某高校学生手机阅读目的调查——学习知识 59.5%、消磨时间 21.3%、获取信息 17%、其他 2.2%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAMWAtADASIAAhEBAxEB/8QAGwABAAMAAwEAAAAAAAAAAAAAAAQFBgIDBwH/xABWEAABBAIABAMDBAkRBQYHAQEAAQIDBAURBhIhMRNBURRhcQciMoEVFiNCUlWRodIXMzU2VGJyc3R1k5SVsbLB0SQ3VoLTQ0RTs+HwJSY0Y5Ki8UXC/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/8QAFhEBAQEAAAAAAAAAAAAAAAAAABEB/9oADAMBAAIRAxEAPwD2YrchxDiMTM2HIZGCrI/6LZn8vN8N9/qLI8o+XBUbJw25U7W3+W/wAPSqOZxmTe+Ojfr2Hx/TZHIiub8U7oTTzF2EymZ+V+rxBQpWKWPqxNbPYmYsXj6RdojV6rvaJ9RJy3yl3KeNyOVr41jauNvJUfDZRzJJkVdczV7J8NL06geigxHFnH83D1fB3K9BtmvllanKrlR7No1emui eading has drawn growing attention from the public.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my classmate, Lily is addicted to reading fragmented articles on her phone all day, which leaves her with little ability to think deeply. Consequently, she finally decided to read paper books again. What is more, we are faced with the undeniable fact that mobile reading plays a crucial role in personal growth. Most importantly, if we ignored the importance of mobile reading, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to mobile reading by ourselves and our community. For one thing, it is imperative for the authorities to promote a healthy digital reading environment. For another, we should balance fragmented reading and deep reading, and new media platforms should appeal to the public to recommend high-quality reading materials to the public. Only through the joint efforts of all people can we effectively promote a healthy reading habit among young people.","words":236},{"id":"ex-二2021","label":"2021 英二","title":"体育锻炼方式（柱状图：独自 54.3%、结伴 47.7%、家人 23.9%、团体 15.8%）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"柱状图：某市居民体育锻炼方式调查——独自锻炼 54.3%、和朋友一起 47.7%、和家人一起 23.9%、团体活动 15.8%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAKpAtADASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAYBAwQFBwII/8QAVBAAAQQCAAMEBwMICAUCBAENAQACAwQFEQYSIRMxQVEUIlJTYZGSB3GBFRYyNXOxstEjNDZCcnSh4SQzVGKTgsEXQ1XwlCUnN2N1g4SVorPS0/H/xAAUAQEAAAAAAAAAAAAAAAAAAAAA/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8A7MtZkeJMNibDK+RyMFWV/wCg2V3KX which keeps him energetic all day long. Consequently, he looks much younger than his age. What is more, we are faced with the undeniable fact that physical exercise plays a crucial role in physical and mental health. Most importantly, if we ignored the importance of physical exercise, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to physical exercise by ourselves and our community. For one thing, it is imperative for the authorities to build more public sports facilities. For another, we should take concrete steps to exercise regularly, and new media platforms should appeal to the public to call on residents to take part in physical exercise. Only through the joint efforts of all people can we effectively promote a healthier and happier life.","words":233},{"id":"ex-二2022","label":"二2022","title":"","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"","img":"","p1":"The bar chart above illustrates the changes in China's express delivery volume from 2018 to 2020, during which both the total volume and the rural volume rose dramatically. To be specific, the total volume soared from 51 billion parcels to 83 billion, while the number of rural parcels more than doubled, from 12 billion to 30 billion. It is apparent from the statistics that the express delivery industry has been developing rapidly in recent years.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my cousin is engaged in selling local fruit online, which helps her reach customers across the country. Consequently, her family income has doubled within two years. What is more, we are faced with the undeniable fact that the express delivery industry plays a crucial role in rapid economic growth. Most importantly, if we ignored the importance of the express delivery industry, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to the express delivery industry by ourselves and our community. For one thing, it is imperative for the authorities to allocate more funds to rural roads and logistics. For another, we should support local products by shopping online, and new media platforms should appeal to the public to introduce rural revitalization to the public. Only through the joint efforts of all people can we effectively promote rural revitalization.","words":242},{"id":"ex-二2023","label":"2023 英二","title":"居民健康素养水平（折线图，2012—2021，8.80% → 25.40%）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"折线图：2012—2021 年我国居民健康素养水平——8.80%、9.48%、9.79%、10.25%、11.58%、14.18%、17.06%、19.17%、23.15%、25.40%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAKpAtADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAQMEAgcI/8QATRAAAQQCAQMCBAIHBQYEAwUJAQACAwQFERIGITETQRQiUWEycQcVFiOBkdFCUlSSoTM1dLGzwUNicoIkNFMXJVWksvE2REWUosLw4f/EABQBAQAAAAAAAAAAAAAAAAAAAAD/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIRAxEAPwD7Mq/a60xNTNyYaQWnXo4zKYWVnOJYP7Q15CsC+WX/AIs/p41R9H1zitNMxPEdj3Ou5/JB9Fw+ax2eoNvYu0yzXcSObfYjyCD3B+xXcvnEeBtfo76YgiqZeDlayLJL80gLXSNd2LIWgOPI6Gh58rmxvVObl6U6ye+5YZNh5pBUklaz1Y2jZDXdiCRpB9PXiGeKzE2WCRskbvDmnYK+aOf1Lc/RxY6it9STETYYuFeGFrOMnnnyA33Hn8+2lZf0bQPi6DxT3WZphJWY4Nk1qPt4boDt+e0G9/XGIZlLeM43H26TPUsRMqvcWM7fN2Hcdx4+qlcPmsdn8ey/i7TLNd5ID277EeQQe4K+awsycn6Zep2Yl9Zlp1BoYbIcWj5Y/opT9DM2P/Zq3SqxTx2q1o/Geq4ODpCPLSO2u3+iD6IiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiA er version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to health literacy by ourselves and our community. For one thing, it is imperative for the authorities to allocate more funds to public health services. For another, we should spread health knowledge to the people around us, and new media platforms should appeal to the public to call on the public to live a healthy life. Only through the joint efforts of all people can we effectively promote the health of the whole nation.","words":236},{"id":"ex-二2024","label":"2024 英二","title":"劳动实践课学生收获（柱状图：知识 91.3%、动手 84.8%、舒畅 54.4%、合作 32.6%）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"柱状图：某高校劳动实践课学生主要收获调查——学习了相关知识 91.3%、提升了动手能力 84.8%、感觉到心情舒畅 54.4%、提升了合作能力 32.6%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAJaAtADASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAUGAQQHAwL/xABGEAABBAIAAwQGCAUCBQMEAwEBAAIDBAURBhIhEzFBURQWImGRkgcVMlJUcYHRI1NVk6FCcjNigrGyJDU2FyU0wUNz4fD/xAAVAQEBAAAAAAAAAAAAAAAAAAAAAf/EABURAQEAAAAAAAAAAAAAAAAAAAAR/9oADAMBAAIRAxEAPwDsyisnxNhsNYZBkshFVkk+w2TY5/y6df0UquVfTS7lv8LO0Tq446aNk9WdyDo2PzmLyskkVG9BPJF/xI2v9tn5t7wt9c5rcP5bIfSu7iwUpaGPgg5NSaElk8pH2Qe7r4+QXjd+kzKUK+OyFnHRV47d51d9CdrmTtjB0JASevy630QdMWCQ0EkgAeJVK4k4zy2G43xuBp0a1pmQiLmcznNc13UdT3a2Ad67tqt8d5zjCDBYiDJx06Et3IdlNHA4uD2hwLeu+jT4jvP+EHWXENaXHuA2VBnjbhsSyxfW0HaQb7VvXceu/mGun6qWpi0KjBddC6xr2zCCGfoCSVyPAXpaH0r8ZTQ42xkXcjx2EAaS72h37I6IOtUchTydVtqhaiswO7pInhzT+oWyuYfQlXghxWTlZkIpJZ5w+SkwEGr3jRBA6nu6dOi6egIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICov0hcH5niu9iJMeaUceOmM participation rates in watching TV, walking, gardening, reading and playing chess among the elderly account for 90.8%, 68.3%, 34.7%, 31.8% and 18.4% respectively. It is apparent from the statistics that the leisure life of the elderly has drawn growing attention from the public.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my grandfather is passionate about watching TV and reading newspapers, which keeps him informed about current affairs. Consequently, he has become the most cheerful one in the community. What is more, we are faced with the undeniable fact that leisure activities of the elderly plays a crucial role in physical and mental health. Most importantly, if we ignored the importance of leisure activities of the elderly, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to leisure activities of the elderly by ourselves and our community. For one thing, it is imperative for the authorities to build more activity centres for the elderly. For another, we should spend more time with our grandparents, and new media platforms should appeal to the public to call on the public to care for the elderly. Only through the joint efforts of all people can we effectively promote the well-being of senior citizens.","words":249},{"id":"ex-二2026","label":"2026 英二","title":"对儿童户外活动的看法（柱状图：好奇心 54.6%、观察力 54.5%、强身 37.2%、亲子 33.2%）","prompt":"Write an essay based on the chart below. In your essay, you should 1) describe the chart, 2) interpret it, and 3) give your comments. Write at least 150 words on the ANSWER SHEET.","cn":"柱状图：某项关于儿童户外活动看法的调查——满足好奇心 54.6%、促进观察力 54.5%、强身健体 37.2%、增强亲子互动 33.2%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAJoAtADASIAAhE n from parents.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my neighbour's son is passionate about playing in the park after school, which helps him develop curiosity and observational skills. Consequently, his parents have noticed his great progress. What is more, we are faced with the undeniable fact that children's outdoor activities plays a crucial role in personal growth. Most importantly, if we ignored the importance of children's outdoor activities, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to children's outdoor activities by ourselves and our community. For one thing, it is imperative for the authorities to improve public facilities for children. For another, we should take our children outdoors at weekends, and new media platforms should appeal to the public to call on parents to value outdoor activities. Only through the joint efforts of all people can we effectively promote the healthy growth of children.","words":236},{"id":"ex-一2024","label":"一2024","title":"","prompt":"Write an essay based on the chart(s) below. In your essay, you should 1) describe the chart(s) briefly, 2) interpret their meaning, and 3) give your comments. Write 160–200 words on the ANSWER SHEET.","cn":"","img":"","p1":"In the picture above is a man running near the fitness area of a newly built park close to his home, and a child beside him says: “The new park at our doorstep is really nice!” In addition, what the above column chart displays is that in a given city, the number of parks increased remarkably from 406 in 2020 to 670 in 2022. The drawing and the chart emphasize the truth that great accomplishments have been made in the construction of public facilities by the government.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my hometown places a high priority on building parks and public facilities, which enables residents to relax nearby. Consequently, citizen satisfaction has improved a lot. What is more, we are faced with the undeniable fact that infrastructure construction plays a crucial role in quality of life. Most importantly, if we ignored the importance of infrastructure construction, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to infrastructure construction by ourselves and our community. For one thing, it is imperative for the authorities to increase investment in public facilities. For another, we should make good use of the facilities around us, and new media platforms should appeal to the public to call on citizens to take part in outdoor activities. Only through the joint efforts of all people can we effectively promote a more liveable city.","words":251},{"id":"ex-一2025","label":"2025 英一","title":"耐用消费品，2014—2023 三变量同向（表格）","prompt":"Write an essay based on the chart(s) below. In your essay, you should 1) describe the chart(s) briefly, 2) interpret their meaning, and 3) give your comments. Write 160–200 words on the ANSWER SHEET.","cn":"表：2014—2023 年全国居民平均每百户年末主要耐用消费品拥有量（台）。空调 75.2 / 96.1 / 117.7 / 145.9；洗衣机 83.7 / 91.7 / 96.7 / 98.2；电冰箱 85.5 / 95.3 / 101.8 / 103.4。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAIFAtADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAQMEAgcI/8QAVRAAAQQBAgMCCQcICgAEBAQHAQACAwQFBhESITETQRQVFiJRVmGV0QcXcYGT0tMjMlNUkZSiszM0NUJSdHWhw/AkYrHBY3KCkjY3Q7IlJmRzg+Hx/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhEDEQA/APsyhsjqvDYrJw4y5ZkjuT/0MQgkcZP/AJdmndTK+W/KA+RnyraQdFH2rxuWs4g3iPF6Sg+hYnPYvONldjbsdgwu4JWjcOjd6HNOxH1hSCoGI0vnMDe1JqkMrTZPIMc6vRZJ+Tbz3HE47bnp6O/nzXPgta5OzrfGYea3HagvUDJOBG3aGdoPEGPbyc3du3ePbyQfR157 ove illustrates the changes in the average ownership of major durable consumer goods per 100 households in China from 2014 to 2023, among which the rise in air conditioners was the most striking. To be specific, the ownership of air conditioners increased dramatically from 75.2 units in 2014 to 145.9 units in 2023. Meanwhile, the number of refrigerators increased modestly, from 85.5 units to 103.4 units. It is apparent from the statistics that household appliances have drawn growing attention from the public.","p2":"A variety of reasons can be cited to account for this phenomenon. To begin with, my aunt places a high priority on choosing smart appliances for her new home, which saves her a great deal of time and effort. Consequently, her life has become much more convenient. What is more, we are faced with the undeniable fact that household appliances plays a crucial role in quality of life. Most importantly, if we ignored the importance of household appliances, we would never become a better version of ourselves.","p3":"It is not difficult to draw the conclusion that enough attention must be paid to household appliances by ourselves and our community. For one thing, it is imperative for the authorities to formulate industry-friendly policies. For another, we should choose appliances according to real needs, and new media platforms should appeal to the public to introduce energy-saving appliances to consumers. Only through the joint efforts of all people can we effectively promote a more convenient and intelligent life.","words":249},{"id":"ex-一2026","label":"2026 英一","title":"养老机器人：饼图 + 柱状图（双图表）","prompt":"Write an essay based on the chart(s) below. In your essay, you should 1) describe the chart(s) briefly, 2) interpret their meaning, and 3) give your comments. Write 160–200 words on the ANSWER SHEET.","cn":"饼图：消费者对养老机器人的接受度——完全接受 39.3%、部分接受 32.8%、不接受 27.9%；柱状图：首要关注点——安全 46.3%、价格 24.9%、便利 10.7%。","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBw const U = UNITS.map(([id,name,desc,type,cards])=>({id,name,desc,type,cards}));
const ALL = U.flatMap(u=>u.cards.map(c=>({...c,unit:u.id,uname:u.name})));

const START=new Date(2026,10,17), EXAM=new Date(2026,11,19);
const INTERVALS=[1,2,4,7,15,30], NEW_PER_DAY=8, KEY='zuowen_r2';
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.cards)return d;}catch(e){}
  return {cards:{},essays:{},log:{}};})();
let storeOK=true;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storeOK=false;
  if(!window.__warned){window.__warned=1;setTimeout(()=>alert('当前浏览器不允许保存进度（可能是无痕模式或本地文件限制）。\n学习记录不会保存，但内容可以正常看。'),300);}}};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const iso=d=>d.toISOString().slice(0,10);
const dayNum=()=>Math.floor((today()-START)/864e5)+1;
const daysLeft=()=>Math.max(0,Math.ceil((EXAM-today())/864e5));
const st=id=>{if(!S.cards[id])S.cards[id]={box:0,due:new Date().toISOString(),seen:0};return S.cards[id];};
const dueTs=s=>{if(!s||!s.due)return 0;return Date.parse(s.due.length<=10?s.due+'T23:59:59':s.due)||0;};
const isDue=s=>s&&s.seen>0&&dueTs(s)<=Date.now();
const HOUR=3600e3;

/* ---------- 队列 ---------- */
function dueList(){return ALL.filter(c=>isDue(S.cards[c.id]));}
function freshList(){return ALL.filter(c=>!S.cards[c.id]);}
function buildQueue(){
  const q=dueList().slice();
  freshList().slice(0,NEW_PER_DAY).forEach(c=>q.push(c));
  if(!q.length) ALL.slice().sort(()=>Math.random()-.5).slice(0,6).forEach(c=>q.push(c));
  return q;
}
function unitProgress(u){
  const done=u.cards.filter(c=>S.cards[c.id]&&S.cards[c.id].seen>0).length;
  return {done,total:u.cards.length,pct:Math.round(done/u.cards.length*100)};
}

/* ---------- 今日 ---------- */
function renderToday(){
  const d=dueList().length, n=Math.min(NEW_PER_DAY,freshList().length);
  dayLabel.textContent='第 '+Math.max(1,dayNum())+' 天';
  dueNum.innerHTML=(d+n)+'<small>张待学</small>';
  const seen=Object.values(S.cards).filter(s=>s.seen>0).length;
  mMastered.textContent=Object.values(S.cards).filter(s=>s.box>=4).length;
  mLearn.textContent=seen-Object.values(S.cards).filter(s=>s.box>=4).length;
  mTotal.textContent=ALL.length; mExam.textContent=Object.values(S.essays||{}).filter(t=>t&&t.trim().length>20).length;
  progBar.style.width=Math.round(seen/ALL.length*100)+'%';
  hintTxt.textContent=(d+n===0?'今天没有待学内容，去「套写」练一套真题吧。':
    `复习 ${d} 张 + 新学 ${n} 张，约 25–30 分钟。`);
  focusTxt.textContent=focusOfDay();
  startBtn.textContent=(d+n===0)?'随机复习 6 张':'开始今天的学习';
}
function focusOfDay(){
  const d=Math.max(1,dayNum());
  if(d<=6) return '第一段打底：待选 1（三种图）、公式 1、方案 4 必须能默写；待选 3 只记「方向相反才用」。';
  if(d<=12) return '第二段论证：方案三、方案五先背熟，方案一四步走和七个举例短语跟上。';
  if(d<=18) return '第三段收尾：政府/个人/媒体三句 + 待选 2，注意 Only 倒装。';
  if(d<=24) return '六大方面短语 + 会背会拼单词，只记 ★/✓ 的，其余混眼熟。';
  if(d<=29) return '套写真题：每天一套，写完对照参考全文改。';
  return '冲刺：只复习，不学新的。重点看★标记的短语和易错句。';
}

/* ---------- 学习 ---------- */
let queue=[],idx=0,cur=null,sessTotal=0,sessMastered=0,sessRepeats=0;
function startQueue(list){
  queue=list.map(c=>c.uname?c:(()=>{const u=U.find(x=>x.cards.some(y=>y.id===c.id));return {...c,unit:u?u.id:'',uname:u?u.name:''};})());
  idx=0;sessTotal=new Set(queue.map(c=>c.id)).size;sessMastered=0;sessRepeats=0;
  study.classList.add('on');renderCard();
}
studyStart=()=>startQueue(buildQueue());
sClose.onclick=()=>{study.classList.remove('on');renderToday();renderUnits();};
startBtn.onclick=()=>startQueue(buildQueue());

function renderCard(){
  if(idx>=queue.length){
    host.innerHTML='<div class="done"><div class="em">🎉</div><h2>这一组过完了</h2>'
      +'<p>共 '+sessTotal+' 张：一次就记住 '+sessMastered+' 张'
      +(sessRepeats?('，反复了 '+sessRepeats+' 次'):'')+'<br>'
      +'反复过的 '+sessRepeats+' 张，<b>4 小时后还会再出现一次</b>，到时候记得再来<br>'
      +'累计已学 '+Object.values(S.cards).filter(s=>s.seen>0).length+' / '+ALL.length+' 张</p>'
      +'<button class="btn" onclick="sClose.onclick()">返回</button></div>';
    sCnt.textContent='';return;
  }
  cur=queue[idx];
  sCnt.textContent=sessBar();
  const c=cur;
  const isTpl=c.ex!==undefined;
  const cls={'第一段':'','第二段':'c2','第三段':'c3','比喻句':'c4'}[c.uname]||'c2';
  const markBadge=c.mark?`<span class="mark">${c.mark}</span>`:'';
  let inner=`
    <span class="tag ${cls}">${c.uname}${c.group?' · '+c.group.split(' · ')[0]:''}</span>${c.__again?`<span class="again">第 ${c.__again+1} 次</span>`:''}
    <h2 class="qname">${c.zh||c.en}${markBadge}</h2>`;
  if(isTpl){
    inner+=`<button class="reveal" id="rv">👀 显示英文模板 + 例句</button>
      <div id="ans" class="hidden">
        <div class="label">模板句</div><div class="en">${hl(c.en)}</div>
        <div class="label">例句（真题套写）</div>
        <div class="exbox"><div class="en">${hl(c.ex)}</div><div class="exzh">${c.exzh}</div></div>
        ${c.tip?`<div class="tip">💡 ${c.tip}</div>`:''}
      </div>`;
  }else if(c.spell){
    inner+=`<div class="spellbox">
        <div class="label" style="margin-top:4px">写出英文</div>
        <input id="inp" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="在这里输入…">
        <button class="btn" id="chk">检查拼写</button>
        <div id="fb"></div>
      </div>`;
  }else{
    inner+=`<button class="reveal" id="rv">👀 显示英文</button>
      <div id="ans" class="hidden">
        <div class="label">英文</div><div class="en">${c.en}</div>
        ${c.yj?`<div class="exzh">${c.yj}</div>`:''}
        ${c.use?`<div class="label">怎么用</div><div class="exbox"><div class="en">${hl(c.use)}</div><div class="exzh">${c.usezh}</div></div>`:''}
        ${c.tip?`<div class="tip">💡 ${c.tip}</div>`:''}
      </div>`;
  }
  host.innerHTML=`<div class="qcard">${inner}</div>
    <div class="btns hidden" id="btns">
      <button class="b1" data-q="0">忘了</button><button class="b2" data-q="1">模糊</button><button class="b3" data-q="2">记得</button>
    </div>`;
  const rv=document.getElementById('rv');
  if(rv) rv.onclick=()=>{ans.classList.remove('hidden');rv.classList.add('hidden');btns.classList.remove('hidden');};
  const chk=document.getElementById('chk');
  if(chk){
    const inp=document.getElementById('inp');
    inp.focus();
    const go=()=>{
      const val=inp.value;
      if(!val.trim())return;
      const ok=checkSpell(val,c.en);
      inp.classList.add(ok?'ok':'no');
      document.getElementById('fb').className='fb '+(ok?'ok':'no');
      document.getElementById('fb').innerHTML=ok?'✅ 拼对了':'❌ 再对一遍'+`<span class="cor">${c.en}</span>`;
      chk.disabled=true;
      btns.classList.remove('hidden');
      if(ok) setTimeout(()=>grade(2),450);
    };
    chk.onclick=go;
    inp.onkeydown=e=>{if(e.key==='Enter')go();};
  }
  document.querySelectorAll('#btns button').forEach(b=>b.onclick=()=>grade(+b.dataset.q));
  study.scrollTop=0;
}
function norm(s){return s.toLowerCase().replace(/[.,;:!?]/g,'').replace(/\s+/g,' ').trim();}
function checkSpell(input,answer){
  const v=norm(input);
  const alts=answer.split(' / ').map(norm);
  return alts.some(a=>a===v||a.replace(/-/g,' ').replace(/\s+/g,' ')===v.replace(/-/g,' '));
}
function hl(t){return t.replace(/\b(Sth1|Sth2|Sth|X|Y1|Y2|A|B|sb|sth)\b/g,'<em>$1</em>');}
function grade(q){
  const c=cur;
  const s=st(c.id);s.seen++;
  const now=Date.now();
  if(q===0){ s.box=0; s.due=new Date(now+2*HOUR).toISOString(); }
  else if(q===1){ s.due=new Date(now+4*HOUR).toISOString(); if(s.box<5)s.box++; }
  else {
    if(c.__lapsed){ s.due=new Date(now+4*HOUR).toISOString(); s.box=Math.max(1,s.box); }
    else { s.box=Math.min(5,s.box+1); s.due=new Date(addD(today(),INTERVALS[Math.min(s.box,5)])).toISOString(); }
  }
  S.log[iso(today())]=(S.log[iso(today())]||0)+1;
  if(q===2){ sessMastered++; }
  else { sessRepeats++; requeue(c,q); }
  save();
  idx++;renderCard();
}
function requeue(c,q){
  const item={...c,__again:(c.__again||0)+1,__lapsed:true};
  // 忘了 → 队尾；模糊 → 4 张之后
  const at = q===0 ? queue.length : Math.min(queue.length, idx+5);
  queue.splice(at,0,item);
}
let toastT=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1600);
}
function sessBar(){
  return '已完成 '+Math.min(idx+1,sessTotal)+'/'+sessTotal;
}

/* ---------- 拼写 ---------- */
const SPELLABLE = ALL.filter(c=>c.spell);
let spQueue=[], spIdx=0, spRight=0, spTotal=0, spCur=null;
function renderSpell(){
  const t=iso(today());
  const due=SPELLABLE.filter(c=>isDue(S.cards[c.id]));
  const fresh=SPELLABLE.filter(c=>!S.cards[c.id]);
  const n=Math.min(12, fresh.length);
  spSub.textContent=SPELLABLE.length+' 个';
  document.getElementById('spDue').innerHTML=(due.length+n)+'<small>个待拼</small>';
  const log=S.log['sp-'+t]||{r:0,t:0};
  document.getElementById('spDone').textContent=log.t;
  document.getElementById('spRate').textContent=log.t?Math.round(log.r/log.t*100)+'%':'—';
  const byUnit={};
  SPELLABLE.forEach(c=>{byUnit[c.uname]=(byUnit[c.uname]||0)+1;});
  document.getElementById('spScope').textContent=Object.entries(byUnit).map(([k,v])=>k.replace('六大方面·','')+' '+v).join('　');
  document.getElementById('spStart').textContent=(due.length+n===0)?'全部练完，随机复习 10 个':'开始拼写（'+Math.min(due.length+n,20)+' 个）';
}
document.getElementById('spStart').onclick=()=>{
  const t=iso(today());
  let q=SPELLABLE.filter(c=>isDue(S.cards[c.id]));
  const fresh=SPELLABLE.filter(c=>!S.cards[c.id]).slice(0,12);
  q=q.concat(fresh);
  if(!q.length) q=SPELLABLE.slice().sort(()=>Math.random()-.5).slice(0,10);
  startSpell(q.slice(0,20));
};
document.getElementById('spAll').onclick=()=>startSpell(SPELLABLE.slice());

function startSpell(list){
  spQueue=list; spIdx=0; spRight=0; spTotal=0;
  sessTotal=new Set(list.map(c=>c.id)).size; sessMastered=0; sessRepeats=0;
  study.classList.add('on'); renderSpellCard();
}
function renderSpellCard(){
  if(spIdx>=spQueue.length){ renderSpellDone(); return; }
  spCur=spQueue[spIdx];
  sCnt.textContent=sessBar();
  const c=spCur;
  host.innerHTML=`
    <div class="qcard">
      <span class="tag c2">${c.uname.replace('六大方面·','')}</span>
      <h2 class="qname">${c.zh}${c.mark?`<span class="mark">${c.mark}</span>`:''}</h2>
      <div class="spellbox">
        <div class="label" style="margin-top:2px">写出英文</div>
        <input id="inp" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="在这里输入…">
        <div style="display:flex;gap:9px;margin-top:10px">
          <button class="btn sec" id="hintBtn" style="margin:0;flex:1">提示</button>
          <button class="btn" id="chk" style="margin:0;flex:1">检查</button>
        </div>
        <div id="fb"></div>
      </div>
    </div>
    <div class="btns hidden" id="btns">
      <button class="b1" data-q="0">忘了</button><button class="b2" data-q="1">模糊</button><button class="b3" data-q="2">记得</button>
    </div>`;
  const inp=document.getElementById('inp');
  inp.focus();
  let tried=0;
  document.getElementById('hintBtn').onclick=()=>{
    document.getElementById('fb').className='fb ok';
    document.getElementById('fb').innerHTML='💡 '+c.hint;
  };
  const go=()=>{
    const v=inp.value; if(!v.trim())return;
    const ok=checkSpell(v,c.en);
    tried++;
    spTotal++;
    if(ok){spRight++;} 
    const lg='sp-'+iso(today()); S.log[lg]=S.log[lg]||{r:0,t:0}; S.log[lg].t++; if(ok)S.log[lg].r++;
    inp.classList.add(ok?'ok':'no');
    document.getElementById('fb').className='fb '+(ok?'ok':'no');
    if(ok){
      document.getElementById('fb').innerHTML='✅ 对了：<span class="cor">'+c.en+'</span>';
      document.getElementById('chk').disabled=true;
      sessMastered++;
      setTimeout(()=>{gradeCard(c,2);spIdx++;renderSpellCard();},600);
    }else{
      document.getElementById('fb').innerHTML=(tried<2?'❌ 不对，再试一次。':'❌ 答案是：<span class="cor">'+c.en+'</span>');
      if(tried>=2){
        document.getElementById('chk').disabled=true;
        document.getElementById('btns').classList.remove('hidden');
      }
    }
    save();
  };
  document.getElementById('chk').onclick=go;
  inp.onkeydown=e=>{if(e.key==='Enter')go();};
  document.querySelectorAll('#btns button').forEach(b=>b.onclick=()=>{
    const q=+b.dataset.q;
    gradeCard(c,q);
    if(q===2){ sessMastered++; }
    else {
      sessRepeats++;
      const item={...c,__again:(c.__again||0)+1,__lapsed:true};
      const at = q===0 ? spQueue.length : Math.min(spQueue.length, spIdx+5);
      spQueue.splice(at,0,item);
    }
    spIdx++; renderSpellCard();
  });
  study.scrollTop=0;
}
function renderSpellDone(){
  const lg='sp-'+iso(today()); const d=S.log[lg]||{r:0,t:0};
  host.innerHTML=`<div class="done"><div class="em">⌨️</div><h2>全部拼对了</h2>
    <p>${sessTotal} 个词全部过关${sessRepeats?('，反复了 '+sessRepeats+' 次，4 小时后还会再出现'):'，一次就过'}${spTotal?('，正确率 '+Math.round(spRight/spTotal*100)+'%'):''}<br>
    今天累计拼写 ${d.t} 次，正确 ${d.r} 次</p>
    <button class="btn" onclick="sClose.onclick()">返回</button></div>`;
  sCnt.textContent='';
}
function gradeCard(c,q){
  const s=st(c.id); s.seen++;
  const now=Date.now();
  if(q===0){ s.box=0; s.due=new Date(now+2*HOUR).toISOString(); }
  else if(q===1){ s.due=new Date(now+4*HOUR).toISOString(); if(s.box<5)s.box++; }
  else {
    if(c.__lapsed){ s.due=new Date(now+4*HOUR).toISOString(); s.box=Math.max(1,s.box); }
    else { s.box=Math.min(5,s.box+1); s.due=new Date(addD(today(),INTERVALS[Math.min(s.box,5)])).toISOString(); }
  }
  save();
}

/* ---------- 单元 ---------- */
function renderUnits(){
  const seen=Object.values(S.cards).filter(s=>s.seen>0).length;
  unitSub.textContent=seen+' / '+ALL.length;
  let rec=-1;
  for(let i=0;i<U.length;i++){const p=unitProgress(U[i]);if(p.pct<100){rec=i;break;}}
  unitList.innerHTML=U.map((u,i)=>{
    const p=unitProgress(u);
    return `<div class="unit ${i===rec?'rec':''}" data-u="${u.id}">
      <div class="no">${i===rec?'▶':i+1}</div>
      <div class="body">
        <div class="nm">${u.name}${i===rec?'<span class="tagx">推荐</span>':''}</div>
        <div class="ds">${u.desc}</div>
        <div class="pb"><i style="width:${p.pct}%"></i></div>
      </div>
      <div class="pct">${p.done}/${p.total}</div>
    </div>
    <div style="display:flex;gap:8px;margin:-6px 0 10px 47px">
      <button class="mini" data-go="${u.id}">学习</button>
      <button class="mini" data-sp="${u.id}">拼写</button>
    </div>`;
  }).join('');
  document.querySelectorAll('.unit').forEach(el=>el.onclick=()=>openUnit(el.dataset.u));
  document.querySelectorAll('button[data-go]').forEach(b=>b.onclick=e=>{e.stopPropagation();openUnit(b.dataset.go);});
  document.querySelectorAll('button[data-sp]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const u=U.find(x=>x.id===b.dataset.sp);
    startSpell(u.cards.filter(c=>c.spell));
  });
}
function openUnit(uid){
  const u=U.find(x=>x.id===uid);
  const unseen=u.cards.filter(c=>!S.cards[c.id]);
  const due=u.cards.filter(c=>isDue(S.cards[c.id]));
  let list=unseen.length?unseen:due.length?due:u.cards.slice().sort(()=>Math.random()-.5).slice(0,10);
  startQueue(list);
}

/* ---------- 真题 ---------- */
function renderExams(){
  examList.innerHTML=EXAMS.map((e,i)=>{
    const t=(S.essays&&S.essays[e.id])||'';
    const w=t.trim()?t.trim().split(/\s+/).length:0;
    return `<div class="exam" data-e="${e.id}">
      <div class="t">${e.label} · ${e.title}</div>
      <div class="s">${w?('已写 '+w+' 词'):'未写'} ｜ 参考 ${e.words} 词</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.exam').forEach(el=>el.onclick=()=>openExam(el.dataset.e));
}
function openExam(eid){
  const e=EXAMS.find(x=>x.id===eid);
  const saved=(S.essays&&S.essays[eid])||'';
  host.innerHTML=`
    <h2 style="font-size:18px;margin:2px 0 0;line-height:1.4">${e.title}</h2>
    ${e.img?`<a href="${e.img}" target="_blank"><img class="eximg" src="${e.img}"></a><div style="font-size:11.5px;color:var(--tx3);text-align:center;margin-top:5px">点图片看大图</div>`:''}
    <div class="prompt">${e.prompt}</div>
    <div class="cn">${e.cn}</div>
    <div class="label" style="margin-top:16px">你的作文</div>
    <textarea id="ta" placeholder="在这里写…（会自动保存）">${saved.replace(/</g,'&lt;')}</textarea>
    <div class="wcount" id="wc"></div>
    <button class="btn sec" id="refBtn">📖 看参考全文</button>
    <div id="refHost"></div>`;
  study.classList.add('on');study.scrollTop=0;sCnt.textContent=e.label;
  const ta=document.getElementById('ta'),wc=document.getElementById('wc');
  const upd=()=>{const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;wc.textContent=n+' 词';};
  upd();
  ta.oninput=()=>{S.essays=S.essays||{};S.essays[eid]=ta.value;save();upd();};
  document.getElementById('refBtn').onclick=()=>{
    document.getElementById('refHost').innerHTML=`
      <div class="ref">
        <div class="p"><b>第一段</b>${e.p1}</div>
        <div class="p"><b>第二段</b>${e.p2}</div>
        <div class="p"><b>第三段</b>${e.p3}</div>
      </div>`;
    document.getElementById('refBtn').disabled=true;
  };
}

/* ---------- 计划 ---------- */
function renderPlan(){
  dLeft.textContent=daysLeft();
  const ph=[
    {d:'第 1–6 天',t:'第一段打底',p:'待选 1（三种图型）、公式 1、方案 4 默写到能闭眼写。待选 3 只记「一升一降才用」。'},
    {d:'第 7–12 天',t:'第二段论证',p:'方案三、方案五先熟；方案一四步走 + 七个举例短语（有激情/沉迷于/致力于/从事/重视/厌烦/漠不关心）。'},
    {d:'第 13–18 天',t:'第三段收尾',p:'方案一/二总结 + 政府·个人·媒体 + 待选 2/4；Only 开头必须倒装。'},
    {d:'第 19–24 天',t:'短句短语 + 单词',p:'六大方面只记 ★/✓；会背会拼用「拼写检测」过一遍，错的抄三遍。'},
    {d:'第 25–29 天',t:'真题套写',p:'每天一套，先自己写再对参考全文；重点改「自己写不出的那句」。'},
    {d:'第 30–32 天',t:'冲刺',p:'不学新的，全量速览 + 只看标错的。'}
  ];
  const d=Math.max(1,dayNum());
  const cur=d<=6?0:d<=12?1:d<=18?2:d<=24?3:d<=29?4:5;
  plans.innerHTML=ph.map((f,i)=>`<div class="plan ${i===cur?'now':''}">${i===cur?'<span class="badge">当前</span>':''}<h3>${f.d} · ${f.t}</h3><p class="p">${f.p}</p></div>`).join('')
   +`<div class="plan"><h3>打卡</h3><div class="days" id="dg"></div></div>`
   +`<div class="plan"><h3>数据 · 换手机时用</h3><p class="p">进度只存在当前浏览器。换手机、清缓存前先导出。</p>
      <button class="btn sec" id="expBtn">导出进度到文件</button>
      <button class="btn sec" id="impBtn">导入进度</button>
      <input type="file" id="impFile" accept=".json,application/json" style="display:none"></div>`;
  let cells='';
  for(let i=1;i<=32;i++){
    const dt=addD(START,i-1),done=(S.log[iso(dt)]||0)>0,isT=iso(dt)===iso(today());
    cells+=`<div class="${isT?'today':(done?'done':'')}">${i}</div>`;
  }
  document.getElementById('dg').innerHTML=cells;
  const exp=document.getElementById('expBtn'),imp=document.getElementById('impBtn'),fi=document.getElementById('impFile');
  if(exp) exp.onclick=()=>{
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='作文复习进度-'+iso(today())+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
  if(imp) imp.onclick=()=>fi.click();
  if(fi) fi.onchange=()=>{
    const f=fi.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.cards) throw new Error('格式不对');
        S=d; save();
        alert('导入成功：'+Object.values(S.cards).filter(x=>x.seen>0).length+' 张卡有记录');
        location.reload();
      }catch(e){ alert('导入失败：'+e.message); }
    };
    r.readAsText(f);
  };
}

/* ---------- 导航 ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('v-'+b.dataset.v).classList.add('on');
  if(b.dataset.v==='plan')renderPlan();
  if(b.dataset.v==='units')renderUnits();
  if(b.dataset.v==='spell')renderSpell();
  if(b.dataset.v==='exams')renderExams();
  window.scrollTo(0,0);
});
renderToday();renderUnits();renderExams();renderPlan();renderSpell();
const H=location.hash.slice(1);
if(H==='study'){setTimeout(()=>startQueue(buildQueue()),100);}
else if(['units','exams','plan','today','spell'].includes(H)){setTimeout(()=>{document.querySelector(`nav button[data-v="${H}"]`).click();},50);}
else if(H.startsWith('spell')){setTimeout(()=>{const u=U.find(x=>x.id===H.replace('spell-',''))||U.find(x=>x.type==='word');startQueue(u.cards.slice(0,20));},100);}
else if(H.startsWith('exam-')){setTimeout(()=>openExam(H.slice(5)),100);}
else if(H.startsWith('unit-')){setTimeout(()=>openUnit(H.slice(5)),100);}
</script>
